## Builds the iOS app (mobile/) on a macOS runner as an UNSIGNED .ipa, meant to be
## sideloaded with AltStore, SideStore or Sideloadly (they sign it with the user's own
## Apple ID). On a tag the .ipa is attached to that release; run by hand
## (workflow_dispatch) it is only kept as a workflow artifact.

name: iOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Liquid Glass needs the iOS 26 SDK, i.e. Xcode 26 or newer.
      - name: Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | awk '{ split($2, v, "."); if (v[1] < 26) { print "Xcode 26+ required"; exit 1 } }'

      - run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform ios --clean

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/ejFlix.xcworkspace \
            -scheme ejFlix \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ejFlix.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Package the .ipa
        id: ipa
        run: |
          version=$(node -p "require('./app.json').expo.version")
          app="$RUNNER_TEMP/ejFlix.xcarchive/Products/Applications/ejFlix.app"
          test -d "$app" || { echo "no .app in the archive"; exit 1; }
          rm -rf "$RUNNER_TEMP/Payload" && mkdir "$RUNNER_TEMP/Payload"
          cp -R "$app" "$RUNNER_TEMP/Payload/"
          name="ejFlix-$version-ios.ipa"
          (cd "$RUNNER_TEMP" && zip -qry "$name" Payload)
          ls -lh "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # The Windows workflow may be creating the same release right now: a failed
          # create is fine as long as the release exists for the upload.
          gh release view "$tag" > /dev/null 2>&1 || \
            gh release create "$tag" --title "ejFlix ${tag#v}" --generate-notes || true
          gh release upload "$tag" "${{ steps.ipa.outputs.path }}" --clobber
          # AltStore source, always at the same address:
          # https://github.com/ej3mpl0/ejflix/releases/latest/download/altstore-source.json
          gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/notes.md" || true
          python3 scripts/altstore_source.py \
            --ipa "${{ steps.ipa.outputs.path }}" --tag "$tag" \
            --entitlements ios/ejFlix/ejFlix.entitlements \
            --notes "$RUNNER_TEMP/notes.md" \
            --out "$RUNNER_TEMP/altstore-source.json"
          gh release upload "$tag" "$RUNNER_TEMP/altstore-source.json" --clobber

      # By hand: the source is only kept for a look, its download link points at no release.
      - name: Keep the .ipa and the AltStore source as an artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 scripts/altstore_source.py \
            --ipa "${{ steps.ipa.outputs.path }}" --tag "untagged" \
            --entitlements ios/ejFlix/ejFlix.entitlements \
            --out "$RUNNER_TEMP/altstore-source.json"

      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ejflix-ios-ipa
          path: |
            ${{ steps.ipa.outputs.path }}
            ${{ runner.temp }}/altstore-source.json
